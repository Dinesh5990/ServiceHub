<template>

    <lightning-card title="Search Customer">

        <div class="slds-p-around_medium">

            <lightning-input
                type="search"
                label="Customer Name"
                placeholder="Enter customer name"
                value={searchKey}
                onchange={handleSearchKeyChange}>
            </lightning-input>

            <div class="slds-m-top_small">

                <lightning-button
                    label="Search"
                    variant="brand"
                    onclick={handleSearch}>
                </lightning-button>

            </div>

        </div>

        <template if:true={customers}>
    <template for:each={customers} for:item="customer">

        <div key={customer.Id} class="slds-m-top_medium">
            <p>
                <strong>{customer.Customer_Name__c}</strong>
            </p>

            <p>{customer.Email__c}</p>

            <lightning-button
                label="Select"
                data-id={customer.Id}
                onclick={handleSelect}>
            </lightning-button>
        </div>

    </template>
</template>

    </lightning-card>



</template>
