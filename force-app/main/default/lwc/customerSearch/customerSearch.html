<template>

    <lightning-card title="Search Customer">

        <div class="slds-p-around_medium">

            <lightning-input
                type="search"
                label="Customer Name"
                placeholder="Enter customer name"
                value={searchKey}
                onchange={handleSearchKeyChange}>
            </lightning-input>

            <div class="slds-m-top_small">

                <lightning-button
                    label="Search"
                    variant="brand"
                    onclick={handleSearch}>
                </lightning-button>

            </div>

        </div>

    </lightning-card>

</template>
